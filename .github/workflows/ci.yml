name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java (Spark needs a JVM)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Smoke-test the pipeline on synthetic data
        run: |
          python scripts/generate_synthetic_waves.py --waves 3 --rows 150 --seed 1 --dirty --out data/raw
          wave-pipeline run -i data/raw -o data/out -c config/pipeline.example.yaml
          wave-pipeline run -i data/raw -o data/out -c config/pipeline.example.yaml --incremental
